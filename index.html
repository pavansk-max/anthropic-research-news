/* Layout: a single centered 85% table-like column, orange masthead, numbered rows, grey subtext, HN-style */

.top { background: var(--bar); color: var(--bar-ink); display: flex; align-items: center; gap: 6px; padding: 2px; flex-wrap: wrap; }

.top .right { margin-left: auto; padding-right: 4px; white-space: nowrap; }

.list { padding: 10px 0 0; }
.item { display: grid; grid-template-columns: auto 14px 1fr; column-gap: 4px; align-items: baseline; }
.rank { color: var(--muted); text-align: right; min-width: 2.2em; }
.vote { cursor: pointer; background: none; border: 0; padding: 0; width: 14px; height: 14px; align-self: start; margin-top: 3px; }
.vote svg { width: 10px; height: 10px; display: block; margin: 0 auto; fill: var(--muted); }
.vote.saved svg { fill: var(--bar); }
.titleline { min-width: 0; font-size: 10pt; line-height: 1.3; }
.titleline > a.t:visited { color: var(--visited); }
.site { color: var(--muted); font-size: 8pt; }
.site a:hover { text-decoration: underline; }
.subtext { grid-column: 3; color: var(--muted); font-size: 7pt; line-height: 1.6; min-width: 0; }
.subtext a { cursor: pointer; }
.subtext a:hover { text-decoration: underline; }
.summary { grid-column: 3; color: var(--ink); font-size: 9pt; line-height: 1.45; max-width: 65ch; padding: 3px 0 2px; }
.spacer { height: 5px; }
.more { padding: 10px 0 10px calc(2.2em + 22px); }
.more a { cursor: pointer; }
.empty { padding: 10px 0 10px calc(2.2em + 22px); color: var(--muted); }
.pagehead { padding: 10px 0 0 calc(2.2em + 22px); color: var(--muted); }
.pagehead b { color: var(--ink); font-weight: normal; }

.years { padding: 10px 0 0 calc(2.2em + 22px); color: var(--muted); display: flex; flex-wrap: wrap; gap: 4px 10px; }

/* footer */

@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

y at the frontier of AI adoption, Anthropic could be a leading indicator of how AI will shift work organization, hiring, and labor demand across the economy.", "date": "2026-10-16", "teams": ["Economics"], "topics": ["Labor market", "Productivity", "Economic Futures", "Agents", "How people use AI"]}, {"slug": "expectations-for-the-future", "title": "Working at the frontier shapes expectations for the future", "desc": "We’re sharing two reports: the first covers how AI is changing employment inside Anthropic, and the second looks at the gap between how the public and Anthropic employees expect AI to affect work and the economy.", "date": "2026-10-16", "teams": ["Economics"], "topics": ["Labor market", "Productivity", "How people use AI", "Agents", "Economic Futures"]}, {"slug": "redesigning-source-control", "title": "Redesigning source control at Anthropic", "desc": "As our merges per day grew more than tenfold, source control became our biggest development bottleneck. Here, we share how we migrated to an in-house version control system in five months.", "date": "2026-10-13", "teams": ["Engineering"], "topics": ["Coding", "Agents", "Productivity", "Claude Code"]}, {"slug": "self-replicating-ai", "title": "AI models may be capable of self-replicating without access to a datacenter", "desc": "Small AI models may be only months away from being able to self-replicate across cheap IoT devices like Android TV boxes, with no datacenter needed.", "date": "2026-10-12", "teams": ["Frontier Red Team"], "topics": ["Safety evaluations", "Cybersecurity", "Agents", "Measurement and mitigation"]}, {"slug": "investigating-unintended-model-actions", "title": "Investigating unintended model actions in our evaluations and internal use", "desc": "Anthropic is an AI safety and research company that's working to build reliable, interpretable, and steerable AI systems.", "date": "2026-10-09", "teams": ["Alignment"], "topics": ["Alignment", "Reward hacking", "Safety evaluations", "Transparency", "Cybersecurity", "Safeguards"]}, {"slug": "launching-opt-in-vuln-finding-service-for-open-source", "title": "An opt-in vulnerability-finding service for open-source software", "desc": "We’re launching OSS Scanner, an opt-in vulnerability scanner for the open-source ecosystem informed by our experience using Claude to find vulnerabilities during Project Glasswing. Projects that join will receive thorough, periodic security scans by our strongest models at no cost.", "date": "2026-10-08", "teams": ["Frontier Red Team"], "topics": ["Cybersecurity", "Open source", "Beneficial Deployments", "Coding", "Access"]}, {"slug": "the-missing-map-of-the-sky", "title": "Using Claude Science to produce the first complete map of the sky in UV light", "desc": "Claude Science helped produce the first complete map of the sky in UV light", "date": "2026-10-08", "teams": ["Science"], "topics": ["Discovery", "Agents", "Education", "Productivity"]}, {"slug": "claude-shaped-science", "title": "Claude-shaped science", "desc": "Matthew Schwartz describes what happened when he stopped fighting Claude and allowed Claude to find “Claude-shaped” problems. This led him to build BootLoops, a toolkit for exact calculations in quantitative science, which he has been applying across scientific fields alongside experts.", "date": "2026-10-01", "teams": ["Science"], "topics": ["Discovery", "Coding", "Open source", "Agents", "Claude Opus"]}, {"slug": "what-work-can-robots-do", "title": "Can we predict the jobs robots will do?", "desc": "What work can robots do? Anthropic's robot exposure index finds robots can do 3/4 of US physical job tasks, but are cost-competitive for only 0.3%.", "date": "2026-09-30", "teams": ["Economics"], "topics": ["Robotics", "Labor market", "Economic Futures", "Measurement and mitigation"]}, {"slug": "glm-5-3-and-the-spread-of-advanced-cyber-capabilities", "title": "GLM-5.3 and the spread of advanced cyber capabilities", "desc": "GLM-5.3 can autonomously build end-to-end cyber exploits, but unlike other frontier models, it was released without meaningful safeguards to limit misuse.", "date": "2026-09-29", "teams": ["Frontier Red Team"], "topics": ["Cybersecurity", "Safeguards", "Jailbreaks", "Safety evaluations", "Open source", "Democratic lead"]}, {"slug": "your-thoughts-on-ai", "title": "What do you want from AI?", "desc": "Anthropic is an AI safety and research company that's working to build reliable, interpretable, and steerable AI systems.", "date": "2026-09-29", "teams": ["Societal Impacts"], "topics": ["How people use AI", "Privacy", "Transparency", "Institute"]}, {"slug": "yes-claude-can-do-nine-loops", "title": "Claude computes a nine-loop amplitude in N=4 super-Yang-Mills", "desc": "Claude computes a nine-loop amplitude in N=4 super-Yang-Mills", "date": "2026-09-25", "teams": ["Science"], "topics": ["Discovery", "Reasoning", "Benchmarks", "Research programs"]}, {"slug": "project-swap", "title": "Project Swap: What happens when agents trade for us?", "desc": "To see what works and what breaks when agents are sent into a market, we made a miniature market of Claudes.", "date": "2026-09-24", "teams": ["Economics"], "topics": ["Agents", "Economic Futures", "How people use AI", "Research programs", "Claude's character"]}, {"slug": "claude-discovers-novel-enzyme-system", "title": "Claude discovers a novel enzyme system", "desc": "In early results from our new life sciences research lab, Claude agents found an enzyme system whose function is still unknown.", "date": "2026-09-23", "teams": [], "topics": ["Life sciences", "Discovery", "Agents", "Research programs"]}, {"slug": "claude-uplifts-biomolecular-modeling", "title": "How Claude is uplifting biomolecular modeling", "desc": "Anthropic is an AI safety and research company that's working to build reliable, interpretable, and steerable AI systems.", "date": "2026-09-17", "teams": ["Science"], "topics": ["Life sciences", "Discovery", "Open source", "Coding", "Partnerships", "Compute & energy"]}, {"slug": "intelligence-targeting-conventional-weapons-capabilities", "title": "Measuring AI capabilities in intelligence targeting and conventional weapons", "desc": "Anthropic’s Frontier Red Team developed new evaluations to measure AI capabilities in tactical intelligence targeting and conventional weapons development.", "date": "2026-09-10", "teams": ["Frontier Red Team"], "topics": ["National security", "Red teaming", "Safety evaluations", "Privacy", "Safeguards", "Claude Opus"]}, {"slug": "alignment-assessment-cybersecurity-incidents", "title": "An alignment assessment of recent cybersecurity incidents", "desc": "We present an alignment assessment of four incidents in which Claude models gained unauthorized access to real third-party systems. ", "date": "2026-09-09", "teams": ["Alignment"], "topics": ["Alignment", "Cybersecurity", "Safety evaluations", "Transparency", "Safeguards", "Training"]}, {"slug": "formalizing-fermats-last-theorem", "title": "Formalizing Fermat's Last Theorem", "desc": "Anthropic is an AI safety and research company that's working to build reliable, interpretable, and steerable AI systems.", "date": "2026-09-04", "teams": ["Science"], "topics": ["Discovery", "Agents", "Coding", "Reasoning", "Partnerships"]}, {"slug": "automated-researchers-mitigate-alignment-failures", "title": "Automated researchers can reliably mitigate alignment failures", "desc": "We had Claude autonomously train models to improve their performance on several public benchmarks that measure 10 categories of alignment failure. For all 10, Claude found fixes that improved the target benchmarks without degrading capabilities. ", "date": "2026-08-28", "teams": ["Alignment"], "topics": ["Alignment", "Agents", "Benchmarks", "Reward hacking", "Sycophancy", "Training"]}, {"slug": "enabling-independent-research", "title": "Enabling independent research on how people use Claude", "desc": "Earlier this year, we ran a pilot giving external researchers access to a ics": ["Discovery", "Reasoning", "Claude Code", "Agents", "Research programs"]}, {"slug": "discovering-cryptographic-weaknesses", "title": "Discovering cryptographic weaknesses with Claude", "desc": "Anthropic researchers find weaknesses in cryptographic algorithms with Claude Mythos Preview", "date": "2026-07-28", "teams": ["Frontier Red Team"], "topics": ["Cybersecurity", "Discovery", "Agents", "Benchmarks", "Partnerships", "National security"]}, {"slug": "project-pilot", "title": "Project Pilot: Can AI models fly drones?", "desc": "We worked with Andon Labs on Drone-Bench, a new benchmark testing whether AI models can autonomously fly a drone to locate and follow a person.", "date": "2026-07-24", "teams": ["Frontier Red Team"], "topics": ["Robotics", "Benchmarks", "Safety evaluations", "Partnerships", "Agents", "Privacy"]}, {"slug": "how-canada-uses-claude", "title": "How Canada uses Claude", "desc": "Anthropic is an AI safety and research company that's working to build reliable, interpretable, and steerable AI systems.", "date": "2026-07-14", "teams": ["Economics"], "topics": ["Economic Index", "How people use AI", "Global expansion", "Labor market", "Economic growth"]}, {"slug": "claude-values-models-languages", "title": "How Claude's values vary by model and language", "desc": "We analyzed 300,000 real conversations to measure the values Claude expresses across models and languages, compressed into four interpretable axes.", "date": "2026-07-13", "teams": ["Societal Impacts"], "topics": ["Claude's character", "How people use AI", "Bias and fairness", "Measurement and mitigation", "Privacy", "Training"]}, {"slug": "claude-plays-robotics", "title": "How Claude performs on robotics tasks", "desc": "Do language models’ strengths transfer to robotics? Can a model perceive a scene, understand a particular robot’s state, and issue actions that reliably effect change in the physical world? We ran tests to find out.", "date": "2026-07-09", "teams": ["Frontier Red Team ", "Measurement and mitigation"]}, {"slug": "towards-measuring-the-representation-of-subjective-global-opinions-in-language-models", "title": "Measuring subjective global opinions in LLMs", "desc": "GlobalOpinionQA quantifies whose opinions LLM responses reflect, finding alignment closest to the US and some European countries.", "date": "2023-06-29", "teams": ["Societal Impacts"], "topics": ["Bias and fairness", "Measurement and mitigation", "Benchmarks", "Constitutional AI"]}, {"slug": "circuits-updates-may-2023", "title": "Circuits Updates — May 2023", "desc": "Developing interpretability ideas on dictionary learning, defining features, and the possibility of superposition in attention heads.", "date": "2023-05-24", "teams": ["Interpretability"], "topics": ["Interpretability", "Research programs", "Transparency"]}, {"slug": "interpretability-dreams", "title": "Interpretability dreams", "desc": "An informal essay on Anthropic's long-term vision for mechanistic interpretability, starting with solving superposition.", "date": "2023-05-24", "teams": ["Interpretability"], "topics": ["Interpretability", "Scaling laws", "Alignment"]}, {"slug": "distributed-representations-composition-superposition", "title": "Distributed representations: Composition and superposition", "desc": "\"Distributed representation\" conflates two distinct ideas, composition and superposition, with very different generalization properties.", "date": "2023-05-04", "teams": ["Interpretability"], "topics": ["Interpretability"]}, {"slug": "privileged-bases-in-the-transformer-residual-stream", "title": "Privileged bases in the transformer residual stream", "desc": "Individual coordinates in the residual stream show unexpected privileged basis behavior, provisionally attributed to Adam's per-dimension normalizers.", "date": "2023-03-16", "teams": ["Interpretability"], "topics": ["Interpretability", "Training"]}, {"slug": "the-capacity-for-moral-self-correction-in-large-language-models", "title": "Moral Small networks can represent more features than they have dimensions when features are sparse, a phenomenon called superposition.", "date": "2022-09-14", "teams": ["Interpretability"], "topics": ["Interpretability", "Training"]}, {"slug": "red-teaming-language-models-to-reduce-harms-methods-scaling-behaviors-and-lessons-learned", "title": "Red teaming language models to reduce harms", "desc": "Red teaming models across scales shows RLHF models become harder to attack as they grow, with a released dataset of 38,961 attacks.", "date": "2022-08-22", "teams": ["Societal Impacts"], "topics": ["Red teaming", "Scaling laws", "Training", "Measurement and mitigation", "Open source", "Transparency"]}, {"slug": "language-models-mostly-know-what-they-know", "title": "Language models (mostly) know what they know", "desc": "Larger models are well calibrated at judging whether their own answers are true, and can predict whether they know an answer before answering.", "date": "2022-07-11", "teams": ["Alignment"], "topics": ["Hallucination", "Alignment", "Scaling laws", "Measurement and mitigation"]}, {"slug": "softmax-linear-units", "title": "Softmax linear units", "desc": "Replacing standard MLP activations with SoLU substantially increases the fraction of interpretable neurons with no performance loss.", "date": "2022-06-17", "teams": ["Interpretability"], "topics": ["Interpretability", "Training", "Alignment"]}, {"slug": "scaling-laws-and-interpretability-of-learning-from-repeated-data", "title": "Scaling laws of learning from repeated data", "desc": "Repeating just 0.1% of training data 100 times made an 800M-parameter model perform as poorly as a 400M one.", "date": "2022-05-21", "teams": ["Interpretability"], "topics": ["Scaling laws", "Interpretability", "Training"]}, {"slug": "training-a-helpful-and-harmless-assistant-with-reinforcement-learning-from-human-feedback", "title": "Training a helpful and harmless assistant with RLHF", "desc": "RLHF fine-tuning improved performance on almost all NLP evaluations, showing essentially no alignment tax for helpfulness and harmlessness.", "date": "2022-04-12", "teams": ["Alignment"], "topics": ["Alignment", "Training", "Scaling laws", "Benchmarks"]}, {"slug": "in-context-learning-and-induction-heads", "title": "In-context learning and induction heads", "desc": "We observe a sharp phase change early in training when induction heads form and in-context learning jumps, across models from 13M to 13B parameters.", "date": "2022-03-08", "teams": ["Interpretability"], "topics": ["Interpretability", "Training", "Scaling laws"]}, {"slug": "predictability-and-surprise-in-large-generative-models", "title": "Predictability and surprise in large generative models", "desc": "Aggregate performance of large models is predictable via scaling laws, yet specific capabilities emerge unpredictably.", "date": "2022-02-15", "teams": ["Societal Impacts"], "topics": ["Scaling laws", "Informed lawmakers", "Measurement and mitigation", "Safety evaluations"]}, {"slug": "a-mathematical-framework-for-transformer-circuits", "title": "A mathematical framework for Transformer Circuits", "desc": "Reverse-engineering small attention-only transformers reveals how induction heads form via head composition.", "date": "2021-12-22", "teams": ["Interpretability"], "topics": ["Interpretability", "Alignment"]}, {"slug": "a-general-language-assistant-as-a-laboratory-for-alignment", "title": "A general language assistant as a lab for alignment", "desc": "A general language assistant as a testbed for alignment, where preference modeling outperforms imitation learning and scales better.", "date": "2021-12-01", "teams": ["Alignment"], "topics": ["Alignment", "Scaling laws", "Training", "Safety evaluations"]}, {"slug": "AI-fluency-index", "title": "Anthropic Education Report: The AI Fluency Index", "desc": "Anthropic's AI Fluency Index measures 11 observable behaviors across thousands of Claude.ai conversations to understand how people develop AI collaboration skills.", "date": "", "teams": [], "topics": []}];
const UPDATED = "2026-11-06";
const PER = 30;
const ORIGIN = "https://www.anthropic.com/research/";
const TEAMS = [
  ["interpretability", "Interpretability"],
  ["alignment", "Alignment"],
  ["frontier-red-team", "Frontier Red Team"],
  ["societal-impacts", "Societal Impacts"],
  ["economics", "Economics"],
  ["science", "Science"],
  ["engineering", "Engineering"],
];
const teamSlug = n => n.toLowerCase().replace(/\s+/g, "-");

let saved = new Set();
try { saved = new Set(JSON.parse(localStorage.getItem("hn-saved") || "[]")); } catch (e) {}
const persist = () => { try { localStorage.setItem("hn-saved", JSON.stringify([...saved])); } catch (e) {} };
let opened = new Set();

const state = { view: "new", team: null, topic: null, year: null, q: "", page: 1 };

function readHash() {
  const h = (location.hash || "").slice(1);
  if (TEAMS.some(t => t[0] === h)) { state.view = "team"; state.team = h; }
  else if (h === "past" || h === "saved") state.view = h;
}

function ago(d) {
  if (!d) return "date unknown";
  const then = new Date(d + "T12:00:00Z"), now = new Date();
  const days = Math.floor((now - then) / 864e5);
  if (days < 1) return "today";
  if (days < 2) return "1 day ago";
  if (days < 31) return days + " days ago";
  const m = Math.floor(days / 30.44);
  if (m < 12) return m + (m === 1 ? " month ago" : " months ago");
  const y = Math.floor(days / 365.25);
  return y + (y === 1 ? " year ago" : " years ago");
}
const fmt = d => d ? new Date(d + "T12:00:00Z").toLocaleDateString("en-US", { year: "numeric", month: "short", day: "numeric", timeZone: "UTC" }) : "";
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

function filtered() {
  let p = POSTS;
  if (state.view === "team") p = p.filter(x => x.teams.some(t => teamSlug(t) === state.team));
  if (state.view === "saved") p = p.filter(x => saved.has(x.slug));
  if (state.view === "past" && state.year) p = p.filter(x => (x.date || "").startsWith(state.year));
  if (state.topic) p = p.filter(x => x.topics.includes(state.topic));
  if (state.q) {
    const terms = state.q.toLowerCase().split(/\s+/).filter(Boolean);
    p = p.filter(x => { const hay = (x.title + " " + x.desc + " " + x.teams.join(" ") + " " + x.topics.join(" ")).toLowerCase(); return terms.every(t => hay.includes(t)); });
  }
  return p;
}

function renderNav() {
  const parts = [`<a class="brand" data-go="new">Research News</a>`];
  const link = (go, label, on) => `<a data-go="${go}" class="${on ? "on" : ""}">${label}</a>`;
  const items = [link("new", "new", state.view === "new" && !state.topic && !state.q), link("past", "past", state.view === "past")];
  TEAMS.forEach(([slug, name]) => items.push(link(slug, name.toLowerCase(), state.view === "team" && state.team === slug)));
  items.push(link("saved", "saved" + (saved.size ? ` (${saved.size})` : ""), state.view === "saved"));
  document.getElementById("nav").innerHTML = parts[0] + items.join('<span class="sep">|</span>');
}

function renderHead() {
  const el = document.getElementById("head");
  let html = "";
  if (state.view === "past") {
    const years = [...new Set(POSTS.map(p => (p.date || "").slice(0, 4)).filter(Boolean))].sort().reverse();
    html += `<div class="years">Year: <a data-year="" class="${!state.year ? "on" : ""}">all</a>` +
      years.map(y => `<a data-year="${y}" class="${state.year === y ? "on" : ""}">${y} <span style="color:var(--muted)">(${POSTS.filter(p => (p.date || "").startsWith(y)).length})</span></a>`).join("") + `</div>`;
  }
  const bits = [];
  if (state.topic) bits.push(`topic <b>${esc(state.topic)}</b> <a data-cleartopic style="cursor:pointer">[clear]</a>`);
  if (state.q) bits.push(`search <b>“${esc(state.q)}”</b> <a data-clearq style="cursor:pointer">[clear]</a>`);
  if (bits.length) html += `<div class="pagehead">${bits.join(" · ")} — ${filtered().length} posts</div>`;
  el.innerHTML = html;
}

const ARROW = '<svg viewBox="0 0 10 10" aria-hidden="true"><path d="M5 0 L10 10 L0 10 Z"/></svg>';

function renderList() {
  const all = filtered();
  const start = (state.page - 1) * PER;
  const rows = all.slice(start, start + PER);
  const el = document.getElementById("list");
  if (!rows.length) {
    el.innerHTML = `<div class="empty">${state.view === "saved" ? "Nothing saved yet. Click the ▲ next to a post to save it here." : "No posts match."}</div>`;
    return;
  }
  el.innerHTML = rows.map((p, i) => {
    const n = start + i + 1;
    const url = ORIGIN + p.slug;
    const teams = p.teams.map(t => `<a data-team="${teamSlug(t)}">${esc(t)}</a>`).join(", ");
    const topics = p.topics.slice(0, 4).map(t => `<a data-topic="${esc(t)}">${esc(t.toLowerCase())}</a>`).join(" · ");
    const isOpen = opened.has(p.slug);
    return `<div class="item">
      <span class="rank">${n}.</span>
      <button class="vote ${saved.has(p.slug) ? "saved" : ""}" data-save="${p.slug}" title="${saved.has(p.slug) ? "Unsave" : "Save"}" aria-label="${saved.has(p.slug) ? "Unsave" : "Save"} ${esc(p.title)}">${ARROW}</button>
      <span class="titleline"><a class="t" href="${url}">${esc(p.title)}</a> <span class="site">(<a href="https://www.anthropic.com/research">anthropic.com</a>)</span></span>
      <span class="subtext">${teams ? "by " + teams + " | " : ""}<span title="${fmt(p.date)}">${ago(p.date)}</span>${topics ? " | " + topics : ""} | <a data-sum="${p.slug}">${isOpen ? "hide" : "summary"}</a></span>
      ${isOpen && p.desc ? `<div class="summary">${esc(p.desc)}</div>` : ""}
    </div><div class="spacer"></div>`;
  }).join("") + (start + PER < all.length ? `<div class="more"><a data-more>More</a></div>` : "");
}

function render() {
  renderNav(); renderHead(); renderList();
  document.getElementById("stamp").textContent = `${POSTS.length} posts from anthropic.com/research, last updated ${fmt(UPDATED)}.`;
}

function go(to) {
  state.page = 1; state.topic = null; state.q = ""; document.getElementById("q").value = "";
  if (to === "new" || to === "past" || to === "saved") { state.view = to; state.team = null; if (to !== "past") state.year = null; }
  else { state.view = "team"; state.team = to; }
  try { history.replaceState(null, "", to === "new" ? location.pathname : "#" + to); } catch (e) {}
  render(); window.scrollTo(0, 0);
}

document.addEventListener("click", e => {
  const a = e.target.closest("[data-go],[data-save],[data-team],[data-topic],[data-more],[data-sum],[data-year],[data-cleartopic],[data-clearq],#logo,#theme");
  if (!a) return;
  if (a.id === "logo") return go("new");
  if (a.id === "theme") {
    const r = document.documentElement, cur = r.getAttribute("data-theme") || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    r.setAttribute("data-theme", cur === "dark" ? "light" : "dark"); return;
  }
  if (a.dataset.go) return go(a.dataset.go);
  if (a.dataset.team) return go(a.dataset.team);
  if (a.dataset.save) { const s = a.dataset.save; saved.has(s) ? saved.delete(s) : saved.add(s); persist(); renderNav(); renderList(); return; }
  if (a.dataset.topic) { state.topic = a.dataset.topic; state.page = 1; render(); window.scrollTo(0, 0); return; }
  if (a.dataset.sum) { const s = a.dataset.sum; opened.has(s) ? opened.delete(s) : opened.add(s); renderList(); return; }
  if ("more" in a.dataset) { state.page++; renderList(); window.scrollTo(0, 0); return; }
  if ("year" in a.dataset) { state.year = a.dataset.year || null; state.page = 1; render(); return; }
  if ("cleartopic" in a.dataset) { state.topic = null; state.page = 1; render(); return; }
  if ("clearq" in a.dataset) { state.q = ""; document.getElementById("q").value = ""; state.page = 1; render(); return; }
});
document.getElementById("q").addEventListener("input", e => { state.q = e.target.value.trim(); state.page = 1; renderHead(); renderList(); });

readHash();
render();
</script>

</html>
