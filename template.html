<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Research News</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: a single centered 85% table-like column, orange masthead, numbered rows, grey subtext, HN-style */
:root {
  --page: #f6f6ef;
  --ground: #ffffff;
  --bar: #ff6600;
  --bar-ink: #000000;
  --ink: #000000;
  --muted: #828282;
  --visited: #828282;
  --rule: #ff6600;
  --hl: #ffffff;
  --input-bg: #ffffff;
  --input-border: #a0a0a0;
  --font: Verdana, Geneva, "DejaVu Sans", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --page: #1d1d1b; --ground: #121211; --bar: #e05a00; --bar-ink: #0b0b0a;
    --ink: #e6e4dc; --muted: #8e8c84; --visited: #8e8c84; --rule: #e05a00; --hl: #f1efe7;
    --input-bg: #2a2a27; --input-border: #555550; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --page: #1d1d1b; --ground: #121211; --bar: #e05a00; --bar-ink: #0b0b0a;
  --ink: #e6e4dc; --muted: #8e8c84; --visited: #8e8c84; --rule: #e05a00; --hl: #f1efe7;
  --input-bg: #2a2a27; --input-border: #555550; color-scheme: dark;
}
body {
  background: var(--ground); color: var(--ink); font-family: var(--font); font-size: 10pt;
  padding-left: max(8px, env(safe-area-inset-left, 0px)); padding-right: max(8px, env(safe-area-inset-right, 0px));
  padding-block: 8px;
}
a { color: inherit; text-decoration: none; }
a:focus-visible, button:focus-visible { outline: 2px solid var(--bar); outline-offset: 1px; }
#hn { width: 85%; max-width: 1200px; margin: 0 auto; background: var(--page); min-width: 0; }
@media (max-width: 750px) { #hn { width: 100%; } body { padding-block: 0; } }

/* masthead */
.top { background: var(--bar); color: var(--bar-ink); display: flex; align-items: center; gap: 6px; padding: 2px; flex-wrap: wrap; }
.logo { width: 18px; height: 18px; border: 1px solid var(--hl); display: inline-grid; place-items: center; color: var(--hl); font-weight: bold; font-size: 10pt; flex: none; }
.brand { font-weight: bold; margin-right: 6px; cursor: pointer; }
.nav { display: flex; flex-wrap: wrap; gap: 0; align-items: center; flex: 1 1 auto; min-width: 0; }
.nav a { cursor: pointer; white-space: nowrap; }
.nav a.on { color: var(--hl); }
.nav .sep { padding: 0 4px; }
.top .right { margin-left: auto; padding-right: 4px; white-space: nowrap; }
.top .right a { cursor: pointer; }

/* list */
.list { padding: 10px 0 0; }
.item { display: grid; grid-template-columns: auto 14px 1fr; column-gap: 4px; align-items: baseline; }
.rank { color: var(--muted); text-align: right; min-width: 2.2em; }
.vote { cursor: pointer; background: none; border: 0; padding: 0; width: 14px; height: 14px; align-self: start; margin-top: 3px; }
.vote svg { width: 10px; height: 10px; display: block; margin: 0 auto; fill: var(--muted); }
.vote.saved svg { fill: var(--bar); }
.titleline { min-width: 0; font-size: 10pt; line-height: 1.3; }
.titleline > a.t:visited { color: var(--visited); }
.site { color: var(--muted); font-size: 8pt; }
.site a:hover { text-decoration: underline; }
.subtext { grid-column: 3; color: var(--muted); font-size: 7pt; line-height: 1.6; min-width: 0; }
.subtext a { cursor: pointer; }
.subtext a:hover { text-decoration: underline; }
.summary { grid-column: 3; color: var(--ink); font-size: 9pt; line-height: 1.45; max-width: 65ch; padding: 3px 0 2px; }
.spacer { height: 5px; }
.more { padding: 10px 0 10px calc(2.2em + 22px); }
.more a { cursor: pointer; }
.empty { padding: 10px 0 10px calc(2.2em + 22px); color: var(--muted); }
.pagehead { padding: 10px 0 0 calc(2.2em + 22px); color: var(--muted); }
.pagehead b { color: var(--ink); font-weight: normal; }

/* filter rows (years, lab categories) */
.years { padding: 10px 0 0 calc(2.2em + 22px); color: var(--muted); display: flex; flex-wrap: wrap; gap: 4px 10px; }
.years a { cursor: pointer; color: var(--ink); }
.years a.on { font-weight: bold; }

/* footer */
.foot { border-top: 2px solid var(--rule); margin-top: 6px; padding: 12px 8px 16px; text-align: center; font-size: 8pt; color: var(--muted); display: grid; gap: 12px; }
.foot .links a { color: var(--ink); }
.foot label { color: var(--muted); font-size: 10pt; }
.foot input { font-family: var(--font); font-size: 10pt; background: var(--input-bg); color: var(--ink); border: 1px solid var(--input-border); padding: 1px 3px; width: min(220px, 60vw); }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div id="hn">
  <div class="top">
    <a class="logo" id="logo" aria-label="Front page">R</a>
    <div class="nav" id="nav"></div>
    <span class="right"><a id="theme" title="Toggle theme">theme</a></span>
  </div>
  <div id="head"></div>
  <div class="list" id="list"></div>
  <div class="foot">
    <div class="links">
      <a href="https://www.anthropic.com/research">anthropic.com/research</a> |
      <a href="https://openai.com/research/index/">openai.com/research</a> |
      <a href="https://deepmind.google/blog/">deepmind.google/blog</a> |
      <a href="https://transformer-circuits.pub">transformer-circuits.pub</a>
    </div>
    <div><label for="q">Search: </label><input id="q" type="text" autocomplete="off" spellcheck="false"></div>
    <div id="stamp"></div>
  </div>
</div>

<script>
const POSTS = __POSTS__;
const UPDATED = "__UPDATED__";
const PER = 30;
const LABS = {
  anthropic: { name: "anthropic", site: "anthropic.com", home: "https://www.anthropic.com/research" },
  openai: { name: "openai", site: "openai.com", home: "https://openai.com/research/index/" },
  deepmind: { name: "deepmind", site: "deepmind.google", home: "https://deepmind.google/blog/" },
};
// Cross-lab themes: a post joins a theme by its lab category, its Anthropic topics, or keywords in its title and summary.
const THEMES = [
  { slug: "safety", name: "safety",
    cats: ["Alignment", "Frontier Red Team", "Safety & Alignment", "Responsibility & Safety"],
    topics: ["Alignment", "Safety evaluations", "Red teaming", "Reward hacking", "Safeguards"],
    re: /\b(alignment|misalign\w*|safety|red[- ]team\w*|jailbreak\w*|reward hacking|deceptive|deception|scheming|sabotage|oversight|monitorability|chain[- ]of[- ]thought monitor\w*|preparedness|system card|misuse|biosecurity|bioresilience|harmful|adversarial)\b/i },
  { slug: "interpretability", name: "interpretability",
    cats: ["Interpretability"], topics: ["Interpretability"],
    re: /\b(interpretab\w*|mechanistic|sparse autoencoder\w*|dictionary learning|monosemantic\w*|superposition|circuits in|neurons in|attribution graph\w*|explain(?:s|ing)? neurons|gemma scope|steering vectors?|activation steering|introspect\w*|extracting concepts|openai microscope)\b/i },
  { slug: "science", name: "science",
    cats: ["Science"], topics: ["Discovery", "Life sciences"],
    re: /\b(scien\w+|biolog\w*|protein\w*|chemi\w+|drug|molecul\w*|genom\w*|dna|rna|cell(?:s|ular)?|disease\w*|medic\w*|health\w*|clinical|physics|fusion|plasma|weather|climate|materials?|mathemat\w*|math\b|theorem\w*|olympiad|alphafold|alphafold\d?|quantum|astronom\w*|neuroscien\w*|enzyme\w*|wet[- ]lab|crispr|forests?|ecolog\w*|conservation)\b/i },
  { slug: "agents", name: "agents",
    cats: [], topics: ["Agents", "Tool use", "Claude Code", "Computer use"],
    re: /\b(agents?|agentic|tool use|tool[- ]using|computer use|computer-using|browsing|browser|operator|codex|coding|software engineer\w*|swe-?bench|multi-agent|autonomous\w*|assistant that acts|deep research|web navigation)\b/i },
  { slug: "economics", name: "economics",
    cats: ["Economics"], topics: ["Labor market", "Economic Index", "Economic Futures", "Productivity"],
    re: /\b(econom\w+|labou?r markets?|employment|unemployment|workforce|productivity|occupation\w*|wages?|gdpval|future of work)\b/i },
];
const inTheme = (t, p) => p.teams.some(c => t.cats.includes(c)) || p.topics.some(c => t.topics.includes(c)) || t.re.test(p.title + " " + p.desc);
const slugify = n => n.toLowerCase().replace(/&/g, "and").replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");

// categories per lab, most posts first
const CATS = {};
for (const lab of Object.keys(LABS)) {
  const c = new Map();
  POSTS.filter(p => p.lab === lab).forEach(p => p.teams.forEach(t => c.set(t, (c.get(t) || 0) + 1)));
  CATS[lab] = [...c.entries()].sort((a, b) => b[1] - a[1]).map(([name, n]) => ({ name, slug: slugify(name), n }));
}

let saved = new Set();
try { saved = new Set(JSON.parse(localStorage.getItem("hn-saved") || "[]")); } catch (e) {}
const persist = () => { try { localStorage.setItem("hn-saved", JSON.stringify([...saved])); } catch (e) {} };
let opened = new Set();

const state = { view: "new", theme: null, lab: null, cat: null, topic: null, year: null, q: "", page: 1 };

function readHash() {
  const h = (location.hash || "").slice(1);
  if (THEMES.some(t => t.slug === h)) { state.view = "theme"; state.theme = h; return; }
  if (LABS[h]) { state.view = "lab"; state.lab = h; return; }
  if (h === "past" || h === "saved") { state.view = h; return; }
  // older links like #interpretability point at an Anthropic team
  const cat = CATS.anthropic.find(c => c.slug === h);
  if (cat) { state.view = "lab"; state.lab = "anthropic"; state.cat = cat.slug; }
}

function ago(d) {
  if (!d) return "date unknown";
  const then = new Date(d + "T12:00:00Z"), now = new Date();
  const days = Math.floor((now - then) / 864e5);
  if (days < 1) return "today";
  if (days < 2) return "1 day ago";
  if (days < 31) return days + " days ago";
  const m = Math.floor(days / 30.44);
  if (m < 12) return m + (m === 1 ? " month ago" : " months ago");
  const y = Math.floor(days / 365.25);
  return y + (y === 1 ? " year ago" : " years ago");
}
const fmt = d => d ? new Date(d + "T12:00:00Z").toLocaleDateString("en-US", { year: "numeric", month: "short", day: "numeric", timeZone: "UTC" }) : "";
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

function filtered() {
  let p = POSTS;
  if (state.view === "lab") {
    p = p.filter(x => x.lab === state.lab);
    if (state.cat) p = p.filter(x => x.teams.some(t => slugify(t) === state.cat));
  }
  if (state.view === "theme") { const t = THEMES.find(t => t.slug === state.theme); p = p.filter(x => inTheme(t, x)); }
  if (state.view === "saved") p = p.filter(x => saved.has(x.id));
  if (state.view === "past" && state.year) p = p.filter(x => (x.date || "").startsWith(state.year));
  if (state.topic) p = p.filter(x => x.topics.includes(state.topic));
  if (state.q) {
    const terms = state.q.toLowerCase().split(/\s+/).filter(Boolean);
    p = p.filter(x => { const hay = (x.title + " " + x.desc + " " + x.lab + " " + x.teams.join(" ") + " " + x.topics.join(" ")).toLowerCase(); return terms.every(t => hay.includes(t)); });
  }
  return p;
}

function renderNav() {
  const link = (go, label, on) => `<a data-go="${go}" class="${on ? "on" : ""}">${label}</a>`;
  const items = [link("new", "new", state.view === "new" && !state.topic && !state.q), link("past", "past", state.view === "past")];
  THEMES.forEach(t => items.push(link(t.slug, t.name, state.view === "theme" && state.theme === t.slug)));
  Object.keys(LABS).forEach(lab => items.push(link(lab, LABS[lab].name, state.view === "lab" && state.lab === lab)));
  items.push(link("saved", "saved" + (saved.size ? ` (${saved.size})` : ""), state.view === "saved"));
  document.getElementById("nav").innerHTML = `<a class="brand" data-go="new">Research News</a>` + items.join('<span class="sep">|</span>');
}

function renderHead() {
  const el = document.getElementById("head");
  let html = "";
  if (state.view === "past") {
    const years = [...new Set(POSTS.map(p => (p.date || "").slice(0, 4)).filter(Boolean))].sort().reverse();
    html += `<div class="years">Year: <a data-year="" class="${!state.year ? "on" : ""}">all</a>` +
      years.map(y => `<a data-year="${y}" class="${state.year === y ? "on" : ""}">${y} <span style="color:var(--muted)">(${POSTS.filter(p => (p.date || "").startsWith(y)).length})</span></a>`).join("") + `</div>`;
  }
  if (state.view === "theme") {
    const t = THEMES.find(t => t.slug === state.theme);
    const ps = POSTS.filter(p => inTheme(t, p));
    html += `<div class="years">Lab: ` + Object.keys(LABS).map(l => `${LABS[l].name} <span style="color:var(--muted)">(${ps.filter(p => p.lab === l).length})</span>`).join(" ") +
      ` <span style="color:var(--muted)">· matched by lab category and keywords, so a rough guide</span></div>`;
  }
  if (state.view === "lab") {
    const total = POSTS.filter(p => p.lab === state.lab).length;
    html += `<div class="years">${state.lab === "anthropic" ? "Team" : "Category"}: <a data-cat="" class="${!state.cat ? "on" : ""}">all <span style="color:var(--muted)">(${total})</span></a>` +
      CATS[state.lab].map(c => `<a data-cat="${c.slug}" class="${state.cat === c.slug ? "on" : ""}">${esc(c.name.toLowerCase())} <span style="color:var(--muted)">(${c.n})</span></a>`).join("") + `</div>`;
  }
  const bits = [];
  if (state.topic) bits.push(`topic <b>${esc(state.topic)}</b> <a data-cleartopic style="cursor:pointer">[clear]</a>`);
  if (state.q) bits.push(`search <b>“${esc(state.q)}”</b> <a data-clearq style="cursor:pointer">[clear]</a>`);
  if (bits.length) html += `<div class="pagehead">${bits.join(" · ")} — ${filtered().length} posts</div>`;
  el.innerHTML = html;
}

const ARROW = '<svg viewBox="0 0 10 10" aria-hidden="true"><path d="M5 0 L10 10 L0 10 Z"/></svg>';

function renderList() {
  const all = filtered();
  const start = (state.page - 1) * PER;
  const rows = all.slice(start, start + PER);
  const el = document.getElementById("list");
  if (!rows.length) {
    el.innerHTML = `<div class="empty">${state.view === "saved" ? "Nothing saved yet. Click the ▲ next to a post to save it here." : "No posts match."}</div>`;
    return;
  }
  el.innerHTML = rows.map((p, i) => {
    const n = start + i + 1;
    const lab = LABS[p.lab];
    const cats = p.teams.map(t => `<a data-lab="${p.lab}" data-catlink="${slugify(t)}">${esc(p.lab === "anthropic" ? t : t.toLowerCase())}</a>`).join(", ");
    const topics = p.topics.slice(0, 4).map(t => `<a data-topic="${esc(t)}">${esc(t.toLowerCase())}</a>`).join(" · ");
    const isOpen = opened.has(p.id);
    const isSaved = saved.has(p.id);
    return `<div class="item">
      <span class="rank">${n}.</span>
      <button class="vote ${isSaved ? "saved" : ""}" data-save="${esc(p.id)}" title="${isSaved ? "Unsave" : "Save"}" aria-label="${isSaved ? "Unsave" : "Save"} ${esc(p.title)}">${ARROW}</button>
      <span class="titleline"><a class="t" href="${esc(p.url)}">${esc(p.title)}</a> <span class="site">(<a data-go="${p.lab}">${lab.site}</a>)</span></span>
      <span class="subtext">${cats ? (p.lab === "anthropic" ? "by " : "in ") + cats + " | " : ""}<span title="${fmt(p.date)}">${ago(p.date)}</span>${topics ? " | " + topics : ""}${p.desc ? ` | <a data-sum="${esc(p.id)}">${isOpen ? "hide" : "summary"}</a>` : ""}</span>
      ${isOpen && p.desc ? `<div class="summary">${esc(p.desc)}</div>` : ""}
    </div><div class="spacer"></div>`;
  }).join("") + (start + PER < all.length ? `<div class="more"><a data-more>More</a></div>` : "");
}

function render() {
  renderNav(); renderHead(); renderList();
  const counts = Object.keys(LABS).map(l => `${POSTS.filter(p => p.lab === l).length} ${LABS[l].site}`).join(", ");
  document.getElementById("stamp").textContent = `${POSTS.length} research posts (${counts}), last updated ${fmt(UPDATED)}.`;
}

function setHash(h) { try { history.replaceState(null, "", h ? "#" + h : location.pathname); } catch (e) {} }

function go(to, cat) {
  state.page = 1; state.topic = null; state.q = ""; state.cat = cat || null; document.getElementById("q").value = "";
  state.theme = null;
  if (LABS[to]) { state.view = "lab"; state.lab = to; }
  else if (THEMES.some(t => t.slug === to)) { state.view = "theme"; state.theme = to; state.lab = null; }
  else { state.view = to; state.lab = null; if (to !== "past") state.year = null; }
  setHash(to === "new" ? "" : to);
  render(); window.scrollTo(0, 0);
}

document.addEventListener("click", e => {
  const a = e.target.closest("[data-go],[data-save],[data-catlink],[data-cat],[data-topic],[data-more],[data-sum],[data-year],[data-cleartopic],[data-clearq],#logo,#theme");
  if (!a) return;
  if (a.id === "logo") return go("new");
  if (a.id === "theme") {
    const r = document.documentElement, cur = r.getAttribute("data-theme") || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    r.setAttribute("data-theme", cur === "dark" ? "light" : "dark"); return;
  }
  if (a.dataset.go) return go(a.dataset.go);
  if (a.dataset.catlink) return go(a.dataset.lab, a.dataset.catlink);
  if ("cat" in a.dataset) { state.cat = a.dataset.cat || null; state.page = 1; render(); return; }
  if (a.dataset.save) { const s = a.dataset.save; saved.has(s) ? saved.delete(s) : saved.add(s); persist(); renderNav(); renderList(); return; }
  if (a.dataset.topic) { state.topic = a.dataset.topic; state.page = 1; render(); window.scrollTo(0, 0); return; }
  if (a.dataset.sum) { const s = a.dataset.sum; opened.has(s) ? opened.delete(s) : opened.add(s); renderList(); return; }
  if ("more" in a.dataset) { state.page++; renderList(); window.scrollTo(0, 0); return; }
  if ("year" in a.dataset) { state.year = a.dataset.year || null; state.page = 1; render(); return; }
  if ("cleartopic" in a.dataset) { state.topic = null; state.page = 1; render(); return; }
  if ("clearq" in a.dataset) { state.q = ""; document.getElementById("q").value = ""; state.page = 1; render(); return; }
});
document.getElementById("q").addEventListener("input", e => { state.q = e.target.value.trim(); state.page = 1; renderHead(); renderList(); });

readHash();
render();
</script>
</html>
